name: Verify portfolio and render resume
on:
  push:
    branches: [fix/portfolio-verified-results-20261028]
    paths:
      - .github/workflows/verify-portfolio.yml
      - scripts/verify-portfolio.cjs
      - index.html
      - resume.html
      - js/**
      - css/**
concurrency:
  group: portfolio-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portfolio-verified-results-20261028
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm install --prefix .qa playwright
      - run: .qa/node_modules/.bin/playwright install --with-deps chromium
      - run: pip install pypdf
      - name: Start static server
        run: python -m http.server 8000 > /tmp/portfolio-server.log 2>&1 &
      - name: Desktop, mobile and PDF checks
        env:
          NODE_PATH: ${{ github.workspace }}/.qa/node_modules
        run: |
          node scripts/verify-portfolio.cjs
          python - <<'PY'
          from pypdf import PdfReader
          doc = PdfReader("resume.pdf")
          assert len(doc.pages) == 1, f"Resume has {len(doc.pages)} pages"
          text = doc.pages[0].extract_text().casefold()
          assert "jalla" in text and "education" in text and "skillrack" in text
          assert "15% accuracy" not in text
          print("Resume PDF: one page, selectable text verified")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-qa
          path: .qa/output/
          retention-days: 7
      - name: Save freshly rendered resume to the repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate verified one-page resume PDF"
            git push origin HEAD:fix/portfolio-verified-results-20261028
          fi
